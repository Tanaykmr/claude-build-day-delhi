<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snap the Room</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; overflow: hidden; background: #24272b; color: #fff; }
    canvas { display: block; width: 100vw; height: 100vh; outline: none; }
    header, footer { position: fixed; left: 24px; right: 24px; pointer-events: none; }
    header { top: 20px; display: flex; align-items: start; justify-content: space-between; gap: 16px; }
    h1 { margin: 0; font-size: clamp(24px, 3vw, 38px); letter-spacing: -.04em; }
    .panel { background: #171b20e8; border: 1px solid #ffffff26; border-radius: 12px; padding: 14px 18px; }
    .subtitle { color: #c6ccd2; margin: 4px 0 0; font-size: 15px; }
    #meter { font-variant-numeric: tabular-nums; font-size: 18px; white-space: nowrap; }
    footer { bottom: 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    #controls { font-size: clamp(15px, 1.7vw, 20px); }
    kbd { font: inherit; font-weight: 650; color: #ffe19d; }
    a, button { pointer-events: auto; color: #fff; }
    a:focus-visible, button:focus-visible { outline: 3px solid #ffc56b; outline-offset: 4px; }
    button { font: inherit; cursor: pointer; background: #424951; border: 1px solid #777f88; border-radius: 7px; padding: 10px 16px; }
    #overlay { position: fixed; inset: 0; display: grid; place-items: center; background: #14181b70; }
    #overlay[hidden] { display: none; }
    #message { width: min(560px, calc(100vw - 40px)); padding: 28px; }
    #message h2 { margin: 0 0 12px; font-size: 26px; }
    #detail { white-space: pre-wrap; overflow-wrap: anywhere; color: #d5dbe1; line-height: 1.5; }
    #actions { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
    #actions[hidden] { display: none; }
    #diagnostics { position: fixed; top: 115px; left: 24px; white-space: pre; font: 12px monospace; pointer-events: none; }
    .strip-label { position: fixed; font: 12px monospace; color: #fff; background: #0009; padding: 2px 6px; pointer-events: none; }
    @media (max-width: 650px) { header, footer { left: 12px; right: 12px; } footer { flex-wrap: wrap; } .panel { padding: 10px 12px; } }
  </style>
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
    } }
  </script>
</head>
<body>
  <header>
    <div class="panel"><h1>Snap the Room</h1><p class="subtitle">A little car. A familiar office.</p></div>
    <div class="panel" id="meter">0.00 m/s</div>
  </header>
  <footer>
    <div class="panel" id="controls"><kbd>WASD / arrows</kbd> drive &nbsp;·&nbsp; <kbd>Space</kbd> brake &nbsp;·&nbsp; <kbd>Shift</kbd> handbrake &nbsp;·&nbsp; <kbd>R</kbd> recover</div>
    <a class="panel" id="mode-link" href="?fallback=1">Simple room</a>
  </footer>
  <div id="overlay"><section class="panel" id="message" role="status" aria-live="polite">
    <h2 id="status-title">Loading…</h2>
    <p id="detail">Starting the room and car.</p>
    <div id="actions" hidden><button id="resume" hidden>Resume driving</button><button id="reload">Reload demo</button><a href="?fallback=1">Try simple room</a></div>
  </section></div>
  <pre id="diagnostics" class="panel" hidden></pre>
  <noscript>This demo needs JavaScript and a local HTTP server.</noscript>
  <script type="module">
    // Track A owns this file. Room geometry and prop placement belong to Track B.
    // Vehicle constants and physics live in car.js, shared with check-drive.mjs (headless test).
    import {
      CAR, STEP, WHEELS, ROOM_FRICTION, HANDLINGS, DEFAULT_HANDLING, createWorld, createCar, roomColliderDesc, stepVehicle, resetCar,
      forwardSpeed, validBody, needsRecovery, eulerToQuaternion, rampGeometry, demoPhases, createDriver, carState,
    } from './car.js';
    let THREE, RAPIER;
    // Chase camera, adapted from Joyride's camera.js (see the attribution in car.js) and scaled from its 4.6 m
    // CRUISER to the 0.12 m car by car length: dist 9 m → 1.96 lengths → 0.235, tuned to 0.26; height 3.6 m →
    // 0.78 lengths → 0.094 → 0.09; lookAhead 6 m → 1.3 lengths → 0.156 → 0.15. The speed terms add the same
    // FRACTION of a length at top speed as Joyride's do at 32 m/s (dist +0.42 lengths, look-ahead +1.74 lengths):
    // distPerSpeed 0.042 s, lookAheadPerSpeed 0.174 s. spring 6 /s and the 1.5× tighter look spring are per-second
    // rates and stay; both are applied as 1-exp(-rate·dt) so 60 Hz and 144 Hz displays converge identically.
    // reverseHold -2 m/s → -0.075 m/s: below this forward speed the camera keeps its last forward (no whip-round
    // in reverse). lookHeight 1.2 m (0.86 car heights) → 0.03 m. Obstruction handling is ours: a ray from the car
    // to the sprung position; a blocked camera first tries lifting over the obstacle (desk edges), else shortens.
    // Both changes ease in fast and ease back out slowly (hysteresis) so a passing chair leg cannot make it flicker.
    const CAMERA = Object.freeze({
      dist: .26, height: .09, lookAhead: .15, distPerSpeed: .042, lookAheadPerSpeed: .174, lookHeight: .03,
      spring: 6, lookSpring: 1.5, reverseHold: -.075, near: .005, far: 50,
      clearance: .02, lift: .14, shortenRate: 24, restoreRate: 2.5,
    });
    const finiteVector = (a, n) => Array.isArray(a) && a.length === n && a.every(Number.isFinite);

    function validateData(ROOM, SPAWN, PROPS) {
      if (!Array.isArray(ROOM) || !ROOM.length) throw new Error('ROOM must be a nonempty array.');
      if (!finiteVector(SPAWN?.pos, 3) || !Number.isFinite(SPAWN?.heading)) throw new Error('SPAWN needs a finite pos and heading.');
      if (!Array.isArray(PROPS)) throw new Error('PROPS must be an array.');
      for (const [entries, dynamic, label] of [[ROOM, false, 'ROOM'], [PROPS, true, 'PROPS']]) {
        entries.forEach((e, i) => {
          if (!e || !finiteVector(e.pos, 3) || !finiteVector(e.size, 3) || e.size.some(n => n <= 0) ||
              (e.rot !== undefined && !finiteVector(e.rot, 3)) || typeof e.tag !== 'string' ||
              !(typeof e.color === 'string' || (typeof e.color === 'number' && Number.isFinite(e.color))) ||
              (dynamic && !(Number.isFinite(e.mass) && e.mass > 0))) {
            throw new Error(`${label}[${i}] violates the room contract (centers, positive full extents, XYZ radians, color, tag${dynamic ? ', positive mass' : ''}).`);
          }
        });
      }
    }

    const overlay = document.querySelector('#overlay');
    const statusTitle = document.querySelector('#status-title');
    const detail = document.querySelector('#detail');
    const actions = document.querySelector('#actions');
    const resume = document.querySelector('#resume');
    let failed = false;
    function showError(error) {
      failed = true;
      console.error(error);
      overlay.hidden = false;
      statusTitle.textContent = 'The demo could not continue';
      detail.textContent = `${error.message || error}\n\nServe this directory over HTTP. Check the selected room module and network connection, then reload.`;
      actions.hidden = false;
      resume.hidden = true;
    }
    document.querySelector('#reload').addEventListener('click', () => location.reload());
    window.addEventListener('error', e => showError(e.error || new Error(e.message)));
    window.addEventListener('unhandledrejection', e => showError(e.reason || new Error('Startup failed.')));

    async function boot() {
      if (location.protocol === 'file:') throw new Error('Start a local HTTP server: python3 -m http.server 8000');
      const params = new URLSearchParams(location.search);
      const fallback = params.has('fallback');
      const modeLink = document.querySelector('#mode-link');
      if (fallback) { modeLink.textContent = 'Full office'; modeLink.href = location.pathname; }
      const modulePath = fallback ? './room.fallback.js' : './room.js';
      let roomModule, propsModule;
      try {
        // Do not import live modules at all when fallback is selected.
        roomModule = await import(modulePath);
        propsModule = fallback ? { PROPS: [] } : await import('./props.js');
      } catch (error) {
        throw new Error(`Could not load ${modulePath}${fallback ? '' : ' or ./props.js'}. Track B must supply the data modules. ${error.message}`);
      }
      const { ROOM } = roomModule, { PROPS } = propsModule;
      let { SPAWN } = roomModule;
      // Debug hook: ?spawn=x,y,z,heading overrides the start (and R) position for scripted screenshots.
      const spawnOverride = (params.get('spawn') || '').split(',').map(Number);
      if (spawnOverride.length === 4 && spawnOverride.every(Number.isFinite)) SPAWN = { pos: spawnOverride.slice(0, 3), heading: spawnOverride[3] };
      validateData(ROOM, SPAWN, PROPS);
      // Debug hook: ?strip=N,dt renders N frames spaced dt simulation-seconds apart into one grid (a
      // filmstrip) so a single screenshot shows motion of the car AND the chase camera. Composes with
      // ?script/?demo/?spawn/?preroll/?cam. The live loop does not run afterwards; the grid stays on screen.
      const stripArg = (params.get('strip') || '').split(',').map(Number);
      const strip = stripArg.length === 2 && stripArg.every(Number.isFinite) && stripArg[0] >= 1
        ? { frames: Math.min(64, Math.round(stripArg[0])), dt: Math.max(STEP, stripArg[1]) } : null;
      detail.textContent = 'Loading renderer and physics…';
      let BufferGeometryUtils;
      [THREE, BufferGeometryUtils, { default: RAPIER }] = await Promise.all([
        import('three'), import('three/addons/utils/BufferGeometryUtils.js'), import('https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.14.0/+esm'),
      ]);
      await RAPIER.init();
      // Track B's lighting/material direction is pure data. If it fails to load, keep flat lights so the demo still boots.
      let LIGHTING = null, MATERIALS = {}, EMISSIVE = {};
      try { ({ LIGHTING, MATERIALS = {}, EMISSIVE = {} } = await import('./lighting.js')); }
      catch (error) { console.warn('lighting.js unavailable, using flat lights.', error); }
      const world = createWorld(RAPIER);
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(LIGHTING?.background || '#bec5cd');
      const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, CAMERA.near, CAMERA.far);
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.5));
      renderer.setSize(innerWidth, innerHeight);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      const shadows = params.has('shadows'); // PRD: start without shadows; ?shadows=1 opts in.
      if (LIGHTING) {
        renderer.toneMapping = THREE[`${LIGHTING.toneMapping || 'ACESFilmic'}ToneMapping`] ?? THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = LIGHTING.exposure ?? 1;
        renderer.shadowMap.enabled = shadows;
      }
      renderer.domElement.tabIndex = 0;
      renderer.domElement.setAttribute('aria-label', 'Office driving game. WASD or arrows to drive, Space to brake, Shift to slide, R to recover.');
      document.body.prepend(renderer.domElement);
      renderer.domElement.addEventListener('webglcontextlost', e => { e.preventDefault(); showError(new Error('Graphics context lost. Reload to restart.')); });
      function directional(spec, castShadow = false) {
        const light = new THREE.DirectionalLight(spec.color, spec.intensity);
        light.position.set(...spec.position);
        light.target.position.set(0, 0, 0);
        scene.add(light, light.target);
        if (castShadow) {
          light.castShadow = true;
          light.shadow.mapSize.set(spec.shadowMapSize || 2048, spec.shadowMapSize || 2048);
          light.shadow.bias = spec.shadowBias ?? -.0005;
          light.shadow.normalBias = spec.shadowNormalBias ?? .02;
          const b = spec.shadowBounds || 11;
          Object.assign(light.shadow.camera, { left: -b, right: b, top: b, bottom: -b, near: .5, far: 30 });
        }
        return light;
      }
      if (LIGHTING) {
        scene.add(new THREE.HemisphereLight(LIGHTING.hemi.sky, LIGHTING.hemi.ground, LIGHTING.hemi.intensity));
        scene.add(new THREE.AmbientLight(LIGHTING.ambient.color, LIGHTING.ambient.intensity));
        directional(LIGHTING.sun, shadows && LIGHTING.sun.castShadow !== false);
        if (LIGHTING.fill) directional(LIGHTING.fill);
        if (LIGHTING.rim) directional(LIGHTING.rim);
      } else {
        scene.add(new THREE.AmbientLight(0xffffff, 1.8));
        directional({ color: 0xfff0d8, intensity: 2.2, position: [-4, 8, 3] });
      }

      const box = new THREE.BoxGeometry(1, 1, 1), materials = new Map();
      // One material per (color, tag): the tag picks roughness/metalness, the color stays the entry's own.
      function material(color, tag = 'default') {
        const hex = new THREE.Color(color).getHex(), key = `${hex}/${tag}`;
        if (!materials.has(key)) {
          const pbr = MATERIALS[tag] || MATERIALS.default || { roughness: .7, metalness: 0 };
          const mat = LIGHTING ? new THREE.MeshStandardMaterial({ color: hex, roughness: pbr.roughness, metalness: pbr.metalness })
            : new THREE.MeshLambertMaterial({ color: hex });
          const glow = EMISSIVE[`#${hex.toString(16).padStart(6, '0')}`];
          if (glow && LIGHTING) { mat.emissive = new THREE.Color(glow.color); mat.emissiveIntensity = glow.intensity ?? 1; }
          materials.set(key, mat);
        }
        return materials.get(key);
      }
      // Same Euler→quaternion math as the collider (car.js) so mesh and physics never disagree.
      function transform(entry) {
        const q = eulerToQuaternion(entry.rot);
        return new THREE.Quaternion(q.x, q.y, q.z, q.w);
      }
      const groups = new Map(), roomBounds = new THREE.Box3(), floorBounds = new THREE.Box3();
      const matrix = new THREE.Matrix4();
      for (const entry of ROOM) {
        const rotation = transform(entry);
        world.createCollider(roomColliderDesc(RAPIER, entry));
        const mat = material(entry.color, entry.tag);
        if (!groups.has(mat)) { groups.set(mat, []); groups.get(mat).tag = entry.tag; }
        matrix.compose(new THREE.Vector3(...entry.pos), rotation, new THREE.Vector3(...entry.size));
        groups.get(mat).push(matrix.clone());
        const bounds = new THREE.Box3(new THREE.Vector3(-.5, -.5, -.5), new THREE.Vector3(.5, .5, .5)).applyMatrix4(matrix);
        roomBounds.union(bounds);
        if (entry.tag === 'carpet') floorBounds.union(bounds);
      }
      const obstacles = [];
      for (const [mat, transforms] of groups) {
        const mesh = new THREE.InstancedMesh(box, mat, transforms.length);
        transforms.forEach((m, i) => mesh.setMatrixAt(i, m));
        mesh.instanceMatrix.needsUpdate = true;
        mesh.computeBoundingSphere();
        mesh.receiveShadow = shadows;
        mesh.castShadow = shadows && transforms.tag !== 'ceiling'; // the ceiling slab would shadow the whole room
        scene.add(mesh);
        obstacles.push(mesh);
      }
      const props = PROPS.map(entry => {
        const body = world.createRigidBody(RAPIER.RigidBodyDesc.dynamic().setTranslation(...entry.pos)
          .setRotation(transform(entry)).setCcdEnabled(true).setLinearDamping(.15).setAngularDamping(.4));
        world.createCollider(RAPIER.ColliderDesc.cuboid(...entry.size.map(n => n / 2)).setFriction(ROOM_FRICTION).setRestitution(0).setMass(entry.mass), body);
        const mesh = new THREE.Mesh(box, material(entry.color, entry.tag));
        mesh.scale.set(...entry.size);
        mesh.castShadow = mesh.receiveShadow = shadows;
        scene.add(mesh);
        obstacles.push(mesh);
        return { body, mesh };
      });
      // Debug/selection hook: ?handling=joyride|classic picks the car.js controller (default joyride; classic is
      // the pre-A1 Rapier-wheel controller kept for comparison). Independent of ?fallback.
      const handling = HANDLINGS.includes(params.get('handling')) ? params.get('handling') : DEFAULT_HANDLING;
      // Optional visual-only surface pack. ?textures=off retains the original materials.
      // No room entries, colliders or vehicle parameters are changed by this module.
      if (params.get('textures') !== 'off') {
        try {
          const { installOfficeTextures } = await import('./office-textures.js');
          window.__officeTextures = await installOfficeTextures({
            THREE, renderer, palette: roomModule.PALETTE || {},
            quality: params.get('textures') === 'low' || params.get('detail') === 'low' ? 'low' : 'high',
            bindings: Array.from(materials, ([key, material]) => ({ material, tag: key.split('/')[1] })),
          });
        } catch (error) { console.warn('Office textures unavailable; retaining original materials.', error); }
      }
      const car = createCar(RAPIER, world, SPAWN, { handling });
      const carMesh = new THREE.Group();
      scene.add(carMesh);
      // Car body in the style of Joyride's carMesh.js: a handful of tapered boxes merged into ONE vertex-coloured,
      // flat-shaded geometry (one draw call) plus two small emissive lamp meshes. Local axes: +Z front, +X left,
      // +Y up. Footprint is unchanged (len .12 × wid .055): every vertex stays inside the collider's z ±.06 and the
      // wheels' x ±.041, so collisions are exactly what they were. Paint: vivid yellow body (distinct from the
      // orange hero wall, the coral chairs and the lime accents), deep navy canopy, off-white hubs, dark trim.
      const PAINT = 0xffc72c, CANOPY = 0x1b2a4a, TRIM = 0x2b2f38, HUB = 0xf4efe6, TIRE = 0x17191c, LAMP = 0xfff3c4;
      const bodyGroup = new THREE.Group(); // receives the visual-only squat/lean; wheels stay on the physics body
      carMesh.add(bodyGroup);
      function tinted(geo, hex) {
        const g = geo.index ? geo.toNonIndexed() : geo;
        const n = g.attributes.position.count, c = new THREE.Color(hex), arr = new Float32Array(n * 3);
        for (let i = 0; i < n; i++) { arr[i * 3] = c.r; arr[i * 3 + 1] = c.g; arr[i * 3 + 2] = c.b; }
        g.setAttribute('color', new THREE.Float32BufferAttribute(arr, 3));
        return g;
      }
      // A box whose top and bottom faces are pulled inward independently at the front (+Z), back (-Z) and sides
      // (±X): the whole silhouette vocabulary (raked nose, canopy, spoiler) comes from this one primitive.
      function taperBox(w, h, d, x, y, z, hex, fiT = 0, biT = 0, siT = 0, fiB = 0, biB = 0, siB = 0) {
        const g = new THREE.BoxGeometry(w, h, d).toNonIndexed(), p = g.attributes.position.array;
        for (let i = 0; i < p.length; i += 3) {
          const top = p[i + 1] > 0, fi = top ? fiT : fiB, bi = top ? biT : biB, si = top ? siT : siB;
          if (p[i + 2] > 0) p[i + 2] -= fi; else p[i + 2] += bi;
          if (p[i] > 0) p[i] -= si; else p[i] += si;
        }
        g.translate(x, y, z);
        return tinted(g, hex);
      }
      const shade = (hex, f) => new THREE.Color(hex).multiplyScalar(f).getHex();
      const parts = [
        taperBox(.052, .016, .116, 0, -.006, 0, PAINT, .014, .006, .004, .004, .003, .002),            // tub, raked nose
        taperBox(.044, .007, .046, 0, .0055, .024, PAINT, .014, 0, .004),                              // bonnet deck
        taperBox(.036, .011, .040, 0, .0075, -.006, CANOPY, .012, .008, .005, .002, .001, .001),       // canopy glass
        taperBox(.026, .003, .026, 0, .0145, -.008, PAINT, .003, .003, .002),                          // roof cap
        taperBox(.048, .004, .014, 0, .008, -.052, PAINT, 0, .002, .002),                              // rear wing
        taperBox(.004, .008, .004, .018, .002, -.052, TRIM), taperBox(.004, .008, .004, -.018, .002, -.052, TRIM), // wing struts
        taperBox(.05, .006, .006, 0, -.011, .057, TRIM), taperBox(.05, .006, .006, 0, -.011, -.057, TRIM),         // bumpers
        taperBox(.004, .005, .092, .026, -.0125, -.002, shade(PAINT, .7)), taperBox(.004, .005, .092, -.026, -.0125, -.002, shade(PAINT, .7)), // rockers
        taperBox(.011, .006, .002, .015, -.001, .0585, TRIM), taperBox(.011, .006, .002, -.015, -.001, .0585, TRIM),   // headlight bezels
        taperBox(.011, .005, .002, .016, .0, -.0585, TRIM), taperBox(.011, .005, .002, -.016, .0, -.0585, TRIM),       // tail bezels
        tinted(new THREE.CylinderGeometry(.0007, .0007, .03, 5).translate(-.018, .026, -.046), TRIM),                // antenna mast
        tinted(new THREE.SphereGeometry(.0022, 8, 6).translate(-.018, .042, -.046), 0xff3b2e),                      // antenna tip
      ];
      const bodyGeometry = BufferGeometryUtils.mergeGeometries(parts, false);
      parts.forEach(g => g.dispose());
      bodyGeometry.computeVertexNormals();
      const carMaterial = LIGHTING
        ? new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: .5, metalness: .05 })
        : new THREE.MeshLambertMaterial({ vertexColors: true });
      const bodyMesh = new THREE.Mesh(bodyGeometry, carMaterial);
      bodyMesh.castShadow = shadows;
      bodyGroup.add(bodyMesh);
      // Lamps: their own materials so the tail lights can switch with the handling's brakeLight state.
      const lampMaterial = (color, emissive, intensity) => (LIGHTING ? new THREE.MeshStandardMaterial({ color, emissive, emissiveIntensity: intensity, roughness: .3 }) : new THREE.MeshLambertMaterial({ color, emissive, emissiveIntensity: intensity }));
      const headMaterial = lampMaterial(LAMP, LAMP, 1.2), tailMaterial = lampMaterial(0x7a1414, 0xff3b2e, .15);
      const lampBox = new THREE.BoxGeometry(.009, .0045, .002);
      for (const sx of [-1, 1]) {
        const head = new THREE.Mesh(lampBox, headMaterial); head.position.set(sx * .015, -.001, .06); bodyGroup.add(head);
        const tail = new THREE.Mesh(lampBox, tailMaterial); tail.position.set(sx * .016, 0, -.06); bodyGroup.add(tail);
      }
      // Wheels: a rotationally symmetric, smooth-shaded tire and hub (so the spin itself is invisible and cannot
      // strobe: at 1.2 m/s a 14 mm tire turns 13.6 rev/s, 82° per physics step, and a flat-shaded 14-facet cylinder
      // read as a jerky wagon wheel), plus dark cross spokes on the hub that carry the rotation cue at the clamped
      // visual rate below. One merged vertex-coloured geometry per wheel, its own smooth material.
      const tireGeometry = new THREE.CylinderGeometry(CAR.wheelR, CAR.wheelR, CAR.wheelWidth, 24).rotateZ(Math.PI / 2); // axle = local X
      const hubGeometry = new THREE.CylinderGeometry(CAR.wheelR * .55, CAR.wheelR * .55, CAR.wheelWidth * 1.08, 16).rotateZ(Math.PI / 2);
      const spokeA = new THREE.BoxGeometry(CAR.wheelWidth * 1.14, CAR.wheelR * .18, CAR.wheelR * .95);
      const spokeB = spokeA.clone().rotateX(Math.PI / 2);
      const wheelGeometry = BufferGeometryUtils.mergeGeometries([tinted(tireGeometry, TIRE), tinted(hubGeometry, HUB), tinted(spokeA, TRIM), tinted(spokeB, TRIM)], false);
      wheelGeometry.computeVertexNormals();
      const wheelMaterial = LIGHTING ? new THREE.MeshStandardMaterial({ vertexColors: true, roughness: .6, metalness: .05 }) : new THREE.MeshLambertMaterial({ vertexColors: true });
      // Cheap grounding shadow: a soft dark ellipse laid on whatever surface is under the car (ray cast down).
      const blobCanvas = document.createElement('canvas'); blobCanvas.width = blobCanvas.height = 128;
      const blobContext = blobCanvas.getContext('2d');
      const gradient = blobContext.createRadialGradient(64, 64, 8, 64, 64, 64);
      gradient.addColorStop(0, 'rgba(0,0,0,.55)'); gradient.addColorStop(.6, 'rgba(0,0,0,.3)'); gradient.addColorStop(1, 'rgba(0,0,0,0)');
      blobContext.fillStyle = gradient; blobContext.fillRect(0, 0, 128, 128);
      const blob = new THREE.Mesh(new THREE.PlaneGeometry(CAR.wid + 2 * CAR.wheelWidth + .05, CAR.len + .04),
        new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(blobCanvas), transparent: true, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -2 }));
      blob.geometry.rotateX(-Math.PI / 2); // Plane faces +Y in car space; car forward is +Z so its long axis is Z.
      blob.renderOrder = 1;
      scene.add(blob);
      const groundRay = new RAPIER.Ray({ x: 0, y: 0, z: 0 }, { x: 0, y: -1, z: 0 });

      const script = (params.get('script') || '').split(',').filter(Boolean).map(token => {
        const [keys, seconds] = token.split(':');
        return { codes: [...keys.toUpperCase()].map(k => SCRIPT_KEYS[k]).filter(Boolean), steps: Math.max(1, Math.round(Number(seconds || 0) / STEP)) };

      let scriptIndex = 0, scriptStep = 0;

      if (demo) subtitle.textContent = 'Demo route playing · press any driving key to take over';
      let resetRequested = false, paused = (script.length || demo || strip) ? false : document.hidden || !document.hasFocus();

      const bodies = [car.body, ...props.map(p => p.body)];

      const currPose = bodies.map(() => ({ p: new THREE.Vector3(), q: new THREE.Quaternion() }));
      const renderPos = new THREE.Vector3(), renderQuat = new THREE.Quaternion();

      // Wheel visuals step at 60 Hz too, so they get the same previous/current treatment: suspension length per
      // wheel, steering angle, and a visual spin whose per-step increment is clamped to VISUAL_SPIN_MAX (4 rev/s;
      // faster than that a real wheel is a blur, and an unclamped 13.6 rev/s aliases against any frame rate).
      const VISUAL_SPIN_MAX = 4 * 2 * Math.PI * STEP; // rad per fixed step
      const wheelVis = { suspPrev: WHEELS.map(() => CAR.suspRest), suspCurr: WHEELS.map(() => CAR.suspRest), steerPrev: 0, steerCurr: 0, spin: 0, spinDelta: 0 };
      function captureWheels() {
        for (let i = 0; i < 4; i++) wheelVis.suspCurr[i] = car.controller.wheelSuspensionLength(i) ?? CAR.suspRest;
        wheelVis.steerCurr = car.steering;

      function resetPoses() {

      function recover() { clearInput(); resetCar(car, SPAWN); resetPoses(); snapCamera = true; }

        advanceScript();
        if (resetRequested) recover();
        prevPose.forEach((pose, i) => { pose.p.copy(currPose[i].p); pose.q.copy(currPose[i].q); });
        for (let i = 0; i < 4; i++) wheelVis.suspPrev[i] = wheelVis.suspCurr[i];
        wheelVis.steerPrev = wheelVis.steerCurr;
        if (demo && demo.done) { demo = null; subtitle.textContent = 'A little car. A familiar office.'; }
        stepVehicle(car, demo ? demo.input(carState(car)) : {
          throttle: Number(down('KeyW', 'ArrowUp')) - Number(down('KeyS', 'ArrowDown')),
          steer: Number(down('KeyA', 'ArrowLeft')) - Number(down('KeyD', 'ArrowRight')),
          brake: down('Space'),
          handbrake: down('ShiftLeft', 'ShiftRight'),
        });

        simTime += STEP;
        capturePoses(currPose); captureWheels();
        if (!validBody(car.body) || props.some(p => !validBody(p.body))) throw new Error('Physics became non-finite. Reload for a clean simulation.');
        if (needsRecovery(car, floorBounds.isEmpty() ? roomBounds : floorBounds)) recover();
      }
      let carHeading = SPAWN.heading;
      // alpha = accumulator/STEP: how far the render sits between the previous and the current physics state.
      function syncMeshes(alpha = 1) {
        renderPos.lerpVectors(prevPose[0].p, currPose[0].p, alpha);
        renderQuat.slerpQuaternions(prevPose[0].q, currPose[0].q, alpha);
        carMesh.position.copy(renderPos); carMesh.quaternion.copy(renderQuat);
        bodyGroup.rotation.set(car.visPitch, 0, car.visRoll); // visual-only squat/lean from the handling state (clamped in car.js)
        tailMaterial.emissive.setHex(car.brakeLight === 2 ? 0xfff1c0 : 0xff3b2e);
        tailMaterial.emissiveIntensity = car.brakeLight ? 2.2 : .15;
        forward.set(0, 0, 1).applyQuaternion(renderQuat);
        if (Math.hypot(forward.x, forward.z) > .1) carHeading = Math.atan2(forward.x, forward.z);

        const spin = wheelVis.spin - wheelVis.spinDelta * (1 - alpha); // back off part of the last increment: no wrap seam

      });

      // Debug hook: ?preroll=seconds advances the simulation (and any ?script) before the first frame.

      setPaused(paused);

          }
          renderer.render(scene, camera);
          frames++; sampleTime += dt;
          if (sampleTime >= .25) {
            meter.textContent = `${Math.abs(forwardSpeed(car)).toFixed(2)} m/s${fallback ? ' · simple room' : ''}${handling !== DEFAULT_HANDLING ? ` · ${handling}` : ''}`;
            if (debug) {
              diagnostics.hidden = false;
              const p = car.body.translation();
              diagnostics.textContent = `${Math.round(frames / sampleTime)} fps · ${renderer.info.render.calls} draws\n${renderer.info.render.triangles} triangles · ${ROOM.length} fixed · ${PROPS.length} props\nposition ${p.x.toFixed(3)}, ${p.y.toFixed(3)}, ${p.z.toFixed(3)}\nwheel contacts ${WHEELS.map((_, i) => +car.controller.wheelIsInContact(i)).join(' ')}\nhandling ${handling} · vF ${car.vF.toFixed(2)} vL ${car.vL.toFixed(2)}${car.slipping ? ' sliding' : ''}${car.airborne ? ' airborne' : ''}\ncamera clip ${camState.clip.toFixed(2)} lift ${camState.lift.toFixed(2)}${camState.blocked ? ' blocked' : ''}\nrAF ${Math.round(frames / sampleTime)} Hz · steps/frame 0:${stepHist[0]} 1:${stepHist[1]} 2:${stepHist[2]}${stepHist.slice(3).some(Boolean) ? ` 3+:${stepHist.slice(3).reduce((a, b) => a + b, 0)}` : ''} · physics ${stepCount ? (stepMs / stepCount).toFixed(2) : '–'} ms/step`;

    }
    boot().catch(showError);
